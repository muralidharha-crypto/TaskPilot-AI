version: '3.8'

services:
  taskpilot:
    build: .
    container_name: taskpilot_ai
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=taskpilot-cloud-production-secret-demo-123
      - AI_PROVIDER=mock
      - DEMO_MODE=true
    volumes:
      - taskpilot_data:/app/instance

volumes:
  taskpilot_data:
