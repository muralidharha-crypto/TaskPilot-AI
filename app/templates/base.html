<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="TaskPilot AI is an autonomous personal productivity agent for intelligent task planning, scheduling, and human-approved execution."
  >

  <meta name="theme-color" content="#111827">

  <title>{% block title %}TaskPilot AI | Autonomous Personal Productivity Agent{% endblock %}</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>"
  >

  <style>
    /* Skip navigation for keyboard and screen-reader users */
    .skip-link {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      z-index: 10000;
      padding: 0.75rem 1rem;
      background: #ffffff;
      color: #111827;
      border: 2px solid #4f46e5;
      border-radius: 0.375rem;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    /* Consistent, visible keyboard focus */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 3px;
    }

    /* Hide decorative content from assistive technologies */
    .brand-icon,
    .nav-icon,
    .button-icon,
    .modal-icon {
      flex-shrink: 0;
    }

    /* Screen-reader-only text */
    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto !important;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">
    Skip to main content
  </a>

  <header class="header">
    <div class="header-inner">

      <a
        href="/"
        class="brand"
        aria-label="TaskPilot AI home"
      >
        <span class="brand-icon" aria-hidden="true">TP</span>

        <span class="brand-text">
          <span class="brand-title">TaskPilot AI</span>
          <span class="brand-subtitle">
            Autonomous Productivity Agent
          </span>
        </span>
      </a>

      <nav aria-label="Main navigation">
        <ul class="nav-links">

          <li>
            <a
              href="/"
              class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}"
              {% if active_tab == 'dashboard' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">⚡</span>
              Dashboard
            </a>
          </li>

          <li>
            <a
              href="/tasks"
              class="nav-link {% if active_tab == 'tasks' %}active{% endif %}"
              {% if active_tab == 'tasks' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">📋</span>
              Tasks
            </a>
          </li>

          <li>
            <a
              href="/planner"
              class="nav-link {% if active_tab == 'planner' %}active{% endif %}"
              {% if active_tab == 'planner' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">📅</span>
              Planner
            </a>
          </li>

          <li>
            <a
              href="/runs"
              class="nav-link {% if active_tab == 'runs' %}active{% endif %}"
              {% if active_tab == 'runs' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">🧠</span>
              Agent Runs
            </a>
          </li>

          <li>
            <a
              href="/approvals"
              class="nav-link {% if active_tab == 'approvals' %}active{% endif %}"
              {% if active_tab == 'approvals' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">🛡️</span>
              Approvals
            </a>
          </li>

          <li>
            <a
              href="/calendar"
              class="nav-link {% if active_tab == 'calendar' %}active{% endif %}"
              {% if active_tab == 'calendar' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">📆</span>
              Calendar
            </a>
          </li>

          <li>
            <a
              href="/research"
              class="nav-link {% if active_tab == 'research' %}active{% endif %}"
              {% if active_tab == 'research' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">🔍</span>
              Research
            </a>
          </li>

          <li>
            <a
              href="/analytics"
              class="nav-link {% if active_tab == 'analytics' %}active{% endif %}"
              {% if active_tab == 'analytics' %}aria-current="page"{% endif %}
            >
              <span class="nav-icon" aria-hidden="true">📊</span>
              Analytics
            </a>
          </li>

        </ul>
      </nav>

      <div class="header-actions" aria-label="Demo controls">

        <button
          type="button"
          class="btn btn-demo btn-sm"
          onclick="DemoRunner.runFullWorkflow()"
          title="Run the full end-to-end demonstration"
        >
          <span class="button-icon" aria-hidden="true">▶</span>
          Run Autonomous Demo
        </button>

        <button
          type="button"
          class="btn btn-secondary btn-sm"
          onclick="DemoRunner.resetAll()"
          title="Reset demo state"
        >
          <span class="button-icon" aria-hidden="true">🔄</span>
          Reset
        </button>

      </div>
    </div>
  </header>

  <main class="main-container" id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Autonomous replanning modal -->
  <div
    class="modal-overlay"
    id="replanModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="replanModalTitle"
    aria-describedby="replanModalBody"
    aria-hidden="true"
    hidden
  >
    <div class="modal-content">

      <div class="modal-header">
        <h2
          class="modal-title"
          id="replanModalTitle"
          style="color: #f59e0b;"
        >
          <span class="modal-icon" aria-hidden="true">🔄</span>
          Autonomous Replanning Center
        </h2>

        <button
          type="button"
          class="modal-close"
          aria-label="Close replanning dialog"
          onclick="TaskPilot.closeModal('replanModal')"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div id="replanModalBody">
        <!-- Replanning content is inserted dynamically -->
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="btn btn-secondary"
          onclick="TaskPilot.closeModal('replanModal')"
        >
          Dismiss
        </button>

        <button
          type="button"
          class="btn btn-success"
          onclick="TaskPilot.applyReplanApproval()"
        >
          <span aria-hidden="true">✓</span>
          Approve &amp; Apply New Schedule
        </button>
      </div>

    </div>
  </div>

  <!-- Accessible notification region -->
  <div
    class="toast-container"
    id="toastContainer"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/demo.js') }}"></script>

  {% block scripts %}{% endblock %}

  <style>
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</body>
</html>
